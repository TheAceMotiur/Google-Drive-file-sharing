# PHP-FPM per-directory overrides (used by Laravel Herd/Nginx setups where
# .htaccess php_value directives are ignored). ini_set() at runtime cannot
# change these PHP_INI_PERDIR directives, so they must be set here instead.
upload_max_filesize = 5120M
post_max_size = 5200M
max_execution_time = 7200
max_input_time = 7200
memory_limit = 768M
